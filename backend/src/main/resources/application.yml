server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml,text/plain

spring:
  application:
    name: stoloto-vip-rooms
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stoloto_vip}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# JWT настройки
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000 # 24 часа
  refresh-expiration-ms: 604800000 # 7 дней

# WebSocket настройки
websocket:
  allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Логирование
logging:
  level:
    root: INFO
    com.stoloto.vip: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  
  file:
    name: logs/stoloto-vip.log

# Аудит и безопасность
audit:
  enabled: true
  log-ip-address: true
  log-user-agent: true

# Настройки игры
game:
  default-house-edge: 5.0 # 5% преимущество казино
  min-players-per-room: 2
  max-players-per-room: 10
  default-betting-duration-sec: 30
  default-round-duration-sec: 60
  max-boosts-per-round: 3
